# What each button does. Edit, save, press the button: no restart, no reflashing.
# Lines starting with # are notes and are ignored.
#
# One action per button:
#   keys = "ctrl+shift+m"            a shortcut (also "play/pause media", "next track",
#                                    "previous track", "volume mute", "f13", "windows+d")
#   type = "some text"               types the text
#   run = "notepad.exe"              opens a program, file, folder or https:// link
#   command = "shutdown /h"          runs a command line
# Several actions in a row (a macro):
#   steps = [ {keys = "ctrl+c"}, {wait = 0.2}, {keys = "ctrl+v"} ]   wait is in seconds
# A different action on a double tap (single taps then wait 0.35 s to be sure):
#   double = {keys = "previous track"}

connection = "bluetooth"   # "usb" or "bluetooth" (restart the helper after changing)
port = "auto"              # USB only: or e.g. "COM5" if auto doesn't find it
volume = true              # false = fader does nothing

[button1]
keys = "play/pause media"

[button2]
keys = "volume mute"

[button3]
keys = "next track"
double = {keys = "previous track"}

[button4]
# Example macro: open Notepad and type into it
steps = [ {run = "notepad.exe"}, {wait = 1.0}, {type = "Hello from my fader!"} ]

# FL Studio: while FL is the window in front, the fader sends MIDI (CC 7 on the
# loopMIDI port "PC Fader") and these buttons replace the ones above. A button not
# listed here keeps its normal action. See "FL Studio" in the README for setup.
[fl]
mode = "auto"          # "auto" = only while FL is in front, "always", or "off"
app = "FL64.exe"       # FL Studio's program name
midi_port = "PC Fader" # the port name you made in loopMIDI
fader_cc = 7            # CC 20-23 are taken by the FL controller's faders
channel = 1

[fl.button1]
keys = "space"         # play / stop

[fl.button2]
keys = "r"             # record on/off

[fl.button3]
keys = "ctrl+s"        # save

[fl.button4]
keys = "f9"            # show the mixer
